version: '3.8'

services:
  # ========================================================================
  # Database Service: MongoDB 7.0 Community Engine
  # ========================================================================
  mongodb:
    image: mongo:7.0
    container_name: mediprocureiq-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - mediprocureiq-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================================================
  # Backend REST API Service: Node.js Express & Mongoose Engine
  # ========================================================================
  backend:
    build:
      context: ./procureiq/backend
      dockerfile: Dockerfile
    container_name: mediprocureiq-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/mediprocureiq
      - JWT_SECRET=mediprocureiq_production_jwt_secret_cloud_2026
      - ALLOW_SELF_APPROVAL=false
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mediprocureiq-net

  # ========================================================================
  # Frontend Web Client: Vite React & Nginx Reverse Proxy
  # ========================================================================
  frontend:
    build:
      context: ./procureiq/frontend
      dockerfile: Dockerfile
    container_name: mediprocureiq-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - mediprocureiq-net

volumes:
  mongo_data:
    name: mediprocureiq_mongo_data

networks:
  mediprocureiq-net:
    name: mediprocureiq_network
    driver: bridge
